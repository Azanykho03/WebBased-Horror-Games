<!doctype html><html><head><meta charset="utf-8"><style>html,body,canvas{margin:0;width:100%;height:100%;display:block;background:#242a30}#label{position:absolute;left:24px;top:18px;color:white;font:18px sans-serif}</style></head><body><canvas id="view"></canvas><div id="label">Source lower body — front / side / back</div><script src="/assets/models/environments/haunted-house/vendor/babylon.js"></script><script src="/assets/models/environments/haunted-house/vendor/babylonjs.loaders.min.js"></script><script>
const B=BABYLON, engine=new B.Engine(document.querySelector('canvas'),true),scene=new B.Scene(engine);scene.useRightHandedSystem=true;scene.clearColor=new B.Color4(.13,.16,.19,1);
const camera=new B.ArcRotateCamera('camera',-Math.PI/2,Math.PI/2,3,new B.Vector3(0,.7,0),scene);camera.attachControl(document.querySelector('canvas'),true);

const light=new B.DirectionalLight('key',new B.Vector3(-.3,-.5,.8),scene);light.intensity=2;

</script></body></html>
