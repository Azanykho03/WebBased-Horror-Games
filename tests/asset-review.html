<!doctype html><html><head><meta charset="UTF-8"><title>Cabinet asset inspection</title><style>body{margin:0;background:#202329;color:white;font:16px sans-serif}canvas{width:100vw;height:90vh}button{padding:10px}</style></head><body><button id="front">Front</button><button id="back">Back</button><button id="left">Side</button><button id="door">Door model</button><pre id="status"></pre><canvas id="canvas"></canvas><script src="/assets/models/environments/haunted-house/vendor/babylon.js"></script><script src="/assets/models/environments/haunted-house/vendor/babylonjs.loaders.min.js"></script><script type="module">
const B=window.BABYLON,engine=new B.Engine(document.querySelector('canvas'),true),scene=new B.Scene(engine);scene.useRightHandedSystem=true;
const camera=new B.ArcRotateCamera('camera',Math.PI/2,Math.PI/2,3,new B.Vector3(0,.9,0),scene);camera.attachControl(document.querySelector('canvas'),true);
new B.HemisphericLight('light',new B.Vector3(0,1,-1),scene).intensity=1.7;
let current;async function load(name){if(current)current.meshes.forEach(m=>m.dispose()); current=await B.SceneLoader.ImportMeshAsync(null,'/assets/models/interactive/',name+'.glb',scene);document.querySelector('#status').textContent=current.meshes.map(m=>{m.computeWorldMatrix(true);return m.name+': '+JSON.stringify(m.getBoundingInfo().boundingBox.minimumWorld.asArray())+' / '+JSON.stringify(m.getBoundingInfo().boundingBox.maximumWorld.asArray())}).join('\n');}
document.querySelector('#front').onclick=()=>camera.alpha=Math.PI/2;document.querySelector('#back').onclick=()=>camera.alpha=-Math.PI/2;document.querySelector('#left').onclick=()=>camera.alpha=0;document.querySelector('#door').onclick=()=>load('old_wooden_door');await load('cabinetForHiding');engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());
</script></body></html>
