<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escape the Haunting · House environment</title>
<style>
:root{color-scheme:dark;--paper:#e4dfcb;--line:#c5ba8d35;--muted:#a6a68e;--ink:#121713;--accent:#bdb487}*{box-sizing:border-box}body{margin:0;background:#111613;color:var(--paper);font:13px system-ui,sans-serif;overflow:hidden}canvas#scene{position:absolute;inset:0;width:100%;height:100%;outline:0;touch-action:none}header{position:absolute;top:0;left:0;right:0;min-height:73px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 24px;background:linear-gradient(#0b100ded,#101710ad,transparent);pointer-events:none}header>*{pointer-events:auto}.brand{display:flex;gap:14px;align-items:center}.seal{height:34px;width:34px;border:1px solid var(--accent);display:grid;place-items:center;font:23px Georgia}.brand strong{display:block;font:19px Georgia;letter-spacing:.7px}.eyebrow{text-transform:uppercase;letter-spacing:2.3px;font-size:9px;color:var(--muted);margin-top:4px}nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap}button,select{font:12px system-ui;color:var(--paper);background:#131c17dc;border:1px solid var(--line);padding:9px 12px;border-radius:2px;cursor:pointer}button:hover,button:focus-visible{background:#30382b;border-color:var(--accent)}button:disabled{opacity:.4;cursor:wait}button.primary{background:var(--paper);color:#202719}select{max-width:188px}#settings{position:absolute;right:23px;top:79px;width:250px;background:#121b16f5;border:1px solid var(--line);padding:18px;z-index:3}#settings label{display:block;margin-bottom:14px;color:var(--muted)}#settings input[type=range]{width:100%;accent-color:var(--accent);margin-top:8px}#settings label.inline{display:flex;align-items:center;gap:10px;color:var(--paper)}.rule{border:0;border-top:1px solid var(--line);margin:14px 0}footer{position:absolute;left:0;right:0;bottom:0;min-height:91px;padding:18px 24px;background:linear-gradient(transparent,#0b120eef);display:flex;align-items:end;justify-content:space-between;gap:20px;pointer-events:none}.location{font:23px Georgia;margin-top:5px}#status{font-size:11px;color:#b9b9a7;margin-top:8px;max-width:650px}.controls{font-size:11px;color:#bcbda9;text-align:right;line-height:1.9}kbd{font:10px monospace;border:1px solid var(--line);padding:2px 4px}#crosshair{position:absolute;top:50%;left:50%;width:3px;height:3px;border-radius:50%;background:#e2debea8;pointer-events:none}#map-panel{position:absolute;top:90px;right:24px;width:320px;border:1px solid var(--line);background:#111a15e8;padding:14px}#map{width:290px;height:370px}.map-title{font:15px Georgia;color:var(--paper);margin-bottom:8px}#load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#121b16eb;border:1px solid var(--line);padding:26px;max-width:400px;text-align:center}#load strong{font:24px Georgia;display:block;margin-bottom:10px}.progress{position:absolute;top:0;left:0;height:2px;background:#c9c096;width:0;transition:width .3s}#review{position:absolute;bottom:112px;left:24px;max-width:520px;max-height:220px;overflow:auto;background:#111b15ee;padding:16px;border:1px solid var(--line);font:11px monospace;white-space:pre-wrap}#touch{position:absolute;left:20px;bottom:116px;display:none;gap:5px}#touch button{width:42px;height:42px}@media(pointer:coarse){#touch{display:flex}.controls{display:none}}@media(max-width:780px){header{padding:12px;align-items:start}.brand strong{font-size:15px}.seal{display:none}nav{justify-content:end;max-width:65%}button,select{font-size:11px;padding:7px}select{max-width:138px}footer{padding:14px}.controls{max-width:38%;font-size:10px}.location{font-size:19px}}
</style></head><body>
<canvas id="scene" tabindex="0" aria-label="First-person haunted house environment"></canvas><div id="crosshair"></div>
<header><div class="brand"><div class="seal">⌂</div><div><strong>Escape the Haunting</strong><div class="eyebrow">Environment · 01</div></div></div>
<nav><button id="enter" class="primary" disabled>Explore</button><button id="tour" disabled>Guided walkthrough</button><select id="room" aria-label="Inspect room" disabled><option value="">Inspect a room…</option></select><button id="map-toggle">Plan</button><button id="settings-toggle">Settings</button></nav></header>
<section id="settings" hidden aria-label="Environment settings"><label>Brightness <input id="brightness" aria-label="Brightness" type="range" min="0.6" max="1.7" step="0.05" value="1.15"></label><label class="inline"><input id="flicker" type="checkbox" checked> Reduced flicker</label><label class="inline"><input id="flashlight" type="checkbox" checked> Flashlight</label><label>Sound volume <input id="volume" aria-label="Sound volume" type="range" min="0" max="0.35" step="0.01" value="0.1"></label><button id="sound">Sound off</button><hr class="rule"><label>Tour speed <input id="speed" aria-label="Tour speed" type="range" min="1" max="5" step="0.25" value="2.5"></label><button id="overview">Cutaway overview</button> <button id="report-toggle">Validation</button></section>
<section id="map-panel" hidden><div class="map-title">House plan <span id="map-floor"></span></div><canvas id="map" width="580" height="740" aria-label="Floor plan with current position"></canvas><div class="eyebrow">N ↑ · 1 unit = 1 metre</div></section>
<section id="load"><strong>Opening the house</strong><span id="load-text">Loading locally stored geometry and materials…</span></section>
<div id="tour-progress" class="progress"></div><pre id="review" hidden></pre>
<div id="touch"><button data-move="left" aria-label="Move left">←</button><button data-move="forward" aria-label="Move forward">↑</button><button data-move="back" aria-label="Move back">↓</button><button data-move="right" aria-label="Move right">→</button></div>
<footer><div><div class="eyebrow" id="floor-label">GROUND FLOOR</div><div class="location" id="location">Entrance foyer</div><div id="status" role="status">Loading…</div><small id="sound-cue" aria-live="polite"></small></div><div class="controls"><kbd>W A S D</kbd> move · drag to look<br><kbd>← →</kbd> look · <kbd>F</kbd> light · <kbd>Esc</kbd> pause</div></footer>
<script src="vendor/babylon.js"></script><script src="vendor/babylonjs.loaders.min.js"></script><script type="module" src="house-viewer.js?v=2" onerror="document.getElementById('load-text').textContent='Module failed to load. Use scripts/3d-generation/serve_assets.py for correct MIME types.'"></script>
</body></html>
